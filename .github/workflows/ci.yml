name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Python
        run: ruff check src tests dags --ignore E401,E402

      - name: Run unit and integration tests
        run: pytest -q

      - name: Validate dbt project
        working-directory: dbt_project
        run: dbt parse --profiles-dir .


  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Airflow image
        run: docker build --tag weather-data-pipeline-airflow:ci .

      - name: Verify runtime tools in image
        run: |
          docker run --rm --entrypoint /bin/bash weather-data-pipeline-airflow:ci -c "git --version && /home/airflow/dbt-venv/bin/dbt --version && /home/airflow/project-venv/bin/python -c 'import requests, duckdb; print(\\"project dependencies OK\\")'"
